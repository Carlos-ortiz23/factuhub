[project]
name = "factuhub-backend"
version = "0.1.0"
description = "Bank reconciliation platform backend (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.1,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
# Deliberately optional: the reconciliation engine must work without pandas so
# the core domain stays free of a heavy, mutable dependency.
tabular = ["pandas>=2.2,<4.0"]
dev = [
    "pytest>=8.2,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: requires a live PostgreSQL instance (TEST_DATABASE_URL)",
    "unit: pure logic, no database, no HTTP",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
